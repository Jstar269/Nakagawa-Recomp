name: Trusted provenance attestation
# The head this run attests is in its title. A workflow_run or dispatched run is
# listed under the default branch, not under the pull request head, so the CI
# verdict (tools/ci_trust_verdict.py, producer_runs) finds it by this title and
# accepts it only when it ran the default branch's current copy of this file.
# The attest job fails unless it attested exactly that head. The candidate jobs
# keep the plain name. One quoted line, as in codeql.yml.
run-name: "${{ (github.event_name == 'pull_request_target' && format('Provenance attestation of {0}', github.event.pull_request.head.sha)) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && format('Provenance attestation of {0}', github.event.workflow_run.head_sha)) || (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '' && format('Provenance attestation of {0}', inputs.head_sha)) || 'Trusted provenance attestation' }}"

# The merge-path provenance gate.
#
# Why not pull_request: for a `pull_request` event the workflow definition comes
# from the pull request itself, so a candidate could keep the required check's
# name and replace its body with `exit 0`. Each route below runs a copy the
# candidate does not control -- the verifier, its inputs, and this file all come
# from trusted main while the candidate is treated purely as data:
#
#   * pull_request_target: the base branch's copy. GitHub blocks this event by
#     default in public repositories from 2026-12-02, so the gate must not
#     depend on it;
#   * workflow_run, when a CI run is requested for a pull request: always the
#     default branch's copy. The event names only that run's head SHA; the job
#     asks GitHub for the one open pull request into the default branch at
#     exactly that head;
#   * workflow_dispatch naming a pull request and its head, to attest again
#     after an admission: the copy at the dispatched ref, which the verdict
#     accepts only when it is the default branch's current copy.
#
# Every route hands secrets to the job, so every line below is written on the
# assumption that the pull request author is hostile:
#
#   * the checkout is pinned to the repository's DEFAULT BRANCH, never to
#     `base.ref`. A pull request author chooses its own base, so checking out
#     `base.ref` would let an author open `evil-head` -> `evil-base` and have
#     this job execute their own tools/ code with the authority token in the
#     environment. The job also refuses to run unless the base IS the default
#     branch, which is the only branch the ruleset protects;
#   * the candidate is NEVER checked out. Its objects are fetched into the
#     trusted checkout and read with `git cat-file`, which returns raw object
#     bytes -- no .gitattributes filter, smudge driver, submodule recursion or
#     checkout hook can run;
#   * no pull request title, body, or branch name is referenced anywhere. The
#     only event data used is the PR number, the head and base SHAs, the
#     triggering run's event name and head SHA, and the dispatch inputs. Each
#     is passed through `env:` and quoted, never interpolated into a script
#     body, and checked for its form before use;
#   * third-party actions are pinned to immutable commit SHAs.
#
# The source-provenance job never uploads an artifact or prints the trusted
# detailed ledger. The manual candidate-binary job below
# has no secrets, runs only from main, uploads a workflow artifact (not a
# release asset), and publishes build attestations for those exact files. Its
# showcase demo PRXs come from the manual showcase_prx job, which has the same
# limits and attests nothing itself.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # CI is requested for every pull request event that can carry a new head, and
  # for a Draft/Ready transition (ci.yml). `requested` starts this run beside
  # CI instead of after it. CI's push, schedule and merge-group runs also
  # arrive here; the attest job skips them.
  workflow_run:
    workflows: ["CI"]
    types: [requested]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Attest a pull request again, by number. Give head_sha too and leave candidate_sha empty.
        required: false
        default: ""
        type: string
      head_sha:
        description: Full 40-character SHA of that pull request's head; the run fails if the head has moved.
        required: false
        default: ""
        type: string
      candidate_sha:
        description: Candidate binaries only. Full 40-character SHA of the frozen main candidate; must match this run.
        required: false
        default: ""
        type: string

concurrency:
  # One attestation per pull request (pull_request_target) or per head (the
  # other routes); a newer one replaces it. A candidate-binary dispatch has
  # neither and is never cancelled.
  group: provenance-attestation-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attest:
    # This job name is RESERVED, not required. tools/provenance_attest_verify.py
    # reserves the string: a candidate workflow declaring a job under the same
    # name is refused.
    #
    # It is deliberately NOT in the branch ruleset's required status checks
    # (docs/CI.md names them; no workflow may name the CI verdict's context).
    # The verdict judges this job by producer at the exact head instead. Until an
    # identity-bound check producer exists, merge-time provenance authority rests
    # on maintainer review, and
    # docs/PROVENANCE_MERGE_GATE.md explains why requiring this context first
    # would give a false assurance: a context name alone is not sufficient
    # anti-spoof protection.
    name: Trusted provenance attestation
    # Only the default branch is ruleset-protected, and only its content is
    # trusted. A pull request targeting any other branch gets no verdict rather
    # than a verdict computed from a base the author may control: the
    # pull_request_target route skips it here, and the other two routes fail in
    # the first step, which finds no pull request into the default branch.
    # A workflow_run of CI attests only when that CI run is a pull request's.
    if: >-
      ${{ (github.event_name == 'pull_request_target' &&
           github.event.pull_request.base.ref == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Read-only. pull-requests: read is for the lookup in the first step.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The TRUSTED side: the default branch, which is also where this file and
      # the verifier came from. Not `base.ref` -- see the header.
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history: the run is judged against the merge base of the head
          # with this branch, which a depth-1 clone would not contain, and the
          # ancestry checks below need real history rather than a graft.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      # Which pull request, head and base this run attests. A pull_request_target
      # event names all three. A workflow_run names only the head its CI run was
      # requested for, and a dispatch is typed by a person, so for both the
      # trusted checkout's resolver asks GitHub for the one open pull request
      # into the default branch at exactly that head and takes the number and
      # the base SHA from that answer. None, or more than one, fails the job:
      # the verdict accepts a green job from a run titled for a head, so a run
      # that resolved nothing must never end green. The values below are
      # numbers and SHAs; none is a title, body or branch name.
      - name: Resolve the pull request at the named head
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          resolve=(python tools/ci_trust_verdict.py --repository "${GITHUB_REPOSITORY}"
                   --default-branch "${DEFAULT_BRANCH}" --attestation-target)
          case "${EVENT_NAME}" in
            pull_request_target)
              case "${EVENT_PR_NUMBER}" in
                ''|*[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
              esac
              for value in "${EVENT_HEAD_SHA}" "${EVENT_BASE_SHA}"; do
                [[ "${value}" =~ ^[0-9a-f]{40}$ ]] || { echo "sha malformed" >&2; exit 1; }
              done
              {
                echo "number=${EVENT_PR_NUMBER}"
                echo "head_sha=${EVENT_HEAD_SHA}"
                echo "base_sha=${EVENT_BASE_SHA}"
              } >> "${GITHUB_OUTPUT}"
              ;;
            workflow_run)
              "${resolve[@]}" --head-sha "${RUN_HEAD_SHA}"
              ;;
            workflow_dispatch)
              # The verdict accepts a dispatched attestation only from the default
              # branch. Any other ref fails here, so nobody waits on an ignored run.
              if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
                echo "dispatch an attestation from ${DEFAULT_BRANCH}, not ${GITHUB_REF}" >&2
                exit 1
              fi
              case "${INPUT_PR_NUMBER}" in
                ''|0*|*[!0-9]*) echo "pull request number is not a plain positive number" >&2; exit 1 ;;
              esac
              "${resolve[@]}" --pull-request "${INPUT_PR_NUMBER}" --head-sha "${INPUT_HEAD_SHA}"
              ;;
            *)
              echo "unsupported event ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      # Data only. refs/pull/N/head is served by the base repository for fork
      # and same-repository pull requests alike, so this needs no token and no
      # trust in the candidate's remote. The fetched tip must be exactly the
      # head SHA the run was started for: if the head moved, this run is judging
      # bytes that are no longer the ones being merged, and it fails closed rather
      # than producing a verdict that could be replayed onto different content.
      # codeql[actions/untrusted-checkout/critical]
      - name: Fetch the candidate objects without checking them out
        env:
          PR_NUMBER: ${{ steps.target.outputs.number }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER}" in
            ''|*[!0-9]*) echo "pull request number is not numeric" >&2; exit 1 ;;
          esac
          for value in "${HEAD_SHA}" "${BASE_SHA}"; do
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]] || { echo "sha malformed" >&2; exit 1; }
          done
          git fetch --no-tags --no-recurse-submodules --quiet \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/pull/${PR_NUMBER}/head:refs/candidate/head"
          fetched="$(git rev-parse refs/candidate/head)"
          if [ "${fetched}" != "${HEAD_SHA}" ]; then
            echo "candidate head moved during this run: event named ${HEAD_SHA}, fetched ${fetched}" >&2
            echo "failing closed; the push that moved it starts its own run" >&2
            exit 1
          fi
          # The base the verdict is computed against must be a real commit on
          # the trusted default branch, not merely whatever the event named.
          if ! git merge-base --is-ancestor "${BASE_SHA}" HEAD; then
            echo "event base ${BASE_SHA} is not an ancestor of the default branch" >&2
            exit 1
          fi
          echo "candidate head ${fetched} fetched as data only (never checked out)"
          echo "event base ${BASE_SHA} confirmed on the default branch"

      # The verdict base is the merge base of the head with the default branch as it is now,
      # as in provenance-attestation-merge-group.yml. The event's base SHA is the default
      # branch's tip when the event fired; a pull request that is merely behind an admission
      # would be judged as removing every path that admission added. Its fork point is the
      # main commit its profile and controls were built against, and it is always on the
      # trusted branch. The landing batch, whose base is the default branch itself, judges
      # the combination.
      - name: Resolve the verdict base
        id: base
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "sha malformed" >&2; exit 1; }
          base_sha="$(git merge-base "${HEAD_SHA}" HEAD)"
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "base sha malformed" >&2; exit 1; }
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "verdict base ${base_sha} (merge base of the head with the default branch)"

      # The private trusted authority. It lands outside GITHUB_WORKSPACE so it
      # is structurally outside the tree under verification, and the verifier
      # refuses to run if that is ever untrue. A missing or unreadable secret
      # is a hard failure: an unverifiable provenance claim is not a passing one.
      - name: Fetch the trusted detailed implementation ledger
        id: authority
        env:
          GH_TOKEN: ${{ secrets.PROVENANCE_AUTHORITY_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          TRUSTED_REPO: Jstar269/nakagawa-recomp-history-private
          TRUSTED_REF: main
          TRUSTED_LEDGER_PATH: docs/provenance/IMPLEMENTATION_PROVENANCE.json
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROVENANCE_AUTHORITY_TOKEN is not configured for this repository." >&2
            echo "The trusted provenance authority cannot be read, so no attestation claim" >&2
            echo "in this pull request can be verified. Failing closed." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/trusted"
          # Resolve the authority revision ONCE and read the ledger AT that
          # revision. Reading "main" and separately asking what "main" is leaves
          # a window in which the two answers describe different content.
          authority_sha="$(gh api "repos/${TRUSTED_REPO}/commits/${TRUSTED_REF}" --jq .sha)"
          [[ "${authority_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "authority sha malformed" >&2; exit 1; }
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${TRUSTED_REPO}/contents/${TRUSTED_LEDGER_PATH}?ref=${authority_sha}" \
            > "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json"
          # Report identity, never content.
          echo "trusted authority ${TRUSTED_REPO}@${authority_sha}"
          echo "authority_sha=${authority_sha}" >> "${GITHUB_OUTPUT}"

          # A candidate policy is still untrusted data. If its exact bytes
          # differ from the trusted base policy, require the private authority
          # to provide both the independently blessed bytes and a document
          # binding the exact semantic delta. The verifier repeats every
          # digest and semantic check; these outputs only select its external
          # inputs. New deltas are keyed by both candidate and base policy
          # digests, so each exact transition has its own authority. Prefer
          # that nested layout and retain the old flat layout as a fallback;
          # the verifier repeats every digest and semantic check.
          base_policy_sha="$(git show "${BASE_SHA}:assets/public_source_profile.json" | sha256sum | cut -d' ' -f1)"
          candidate_policy_sha="$(git show "${HEAD_SHA}:assets/public_source_profile.json" | sha256sum | cut -d' ' -f1)"
          for value in "${base_policy_sha}" "${candidate_policy_sha}"; do
            case "${value}" in
              [0-9a-f]*) [ "${#value}" -eq 64 ] || { echo "policy sha malformed" >&2; exit 1; } ;;
              *) echo "policy sha malformed" >&2; exit 1 ;;
            esac
          done
          echo "base policy sha256 ${base_policy_sha}"
          echo "candidate policy sha256 ${candidate_policy_sha}"
          if [ "${base_policy_sha}" != "${candidate_policy_sha}" ]; then
            # v4-policy-delta-lookup:begin (the same block in both attestation workflows)
            # A V4 authority binds each added path to its origin claim (the trusted record's class,
            # upstream, revision and licence), and to its SHA-256 only where the admission declared a
            # byte-identical import. It is stored under the SHA-256 of its selector, which the
            # trusted checkout's verifier derives from the base and candidate profiles alone, so an
            # edit to an admitted file selects the same decision. The name only selects: the
            # verifier derives the whole document again, claims and byte bindings included, and
            # requires the fetched bytes to equal it exactly. A failed derivation fails this step.
            v4_name="$(python tools/provenance_attest_verify.py --repo "${GITHUB_WORKSPACE}" \
              --base "${BASE_SHA}" --candidate "${HEAD_SHA}" --policy-delta-key-v4)"
            case "${v4_name}" in
              [0-9a-f]*) [ "${#v4_name}" -eq 64 ] || { echo "V4 policy delta name malformed" >&2; exit 1; } ;;
              *) echo "V4 policy delta name malformed" >&2; exit 1 ;;
            esac
            if gh api \
              -H "Accept: application/vnd.github.raw" \
              "repos/${TRUSTED_REPO}/contents/docs/provenance/policy-deltas-v4/${v4_name}.json?ref=${authority_sha}" \
              > "${RUNNER_TEMP}/trusted/policy-delta-authority.json" 2> "${RUNNER_TEMP}/trusted/v4-lookup.err"; then
              echo "V4 policy delta authority ${v4_name} materialized"
              echo "policy_delta_authority=${RUNNER_TEMP}/trusted/policy-delta-authority.json" >> "${GITHUB_OUTPUT}"
            else
              # Only a confirmed absence falls back to an admission from before V4; any other
              # lookup error fails this step.
              if ! grep -q "HTTP 404" "${RUNNER_TEMP}/trusted/v4-lookup.err"; then
                cat "${RUNNER_TEMP}/trusted/v4-lookup.err" >&2
                echo "the V4 policy delta lookup failed for a reason other than its absence" >&2
                exit 1
              fi
              rm -f "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
              # v3-policy-delta-lookup:begin (the same block in both attestation workflows)
              # No V4 authority: an admission from before V4 left a V3 authority (#1673). It records
              # only this change: the added paths with their admitted SHA-256, the removed paths,
              # the exclude-list and rule changes. It stays valid when unrelated paths land. The
              # trusted checkout's verifier derives it from the base and candidate profiles and the
              # candidate's blobs; its SHA-256 is the stored file's name. The name only selects: the
              # verifier derives the document again and requires the fetched bytes to equal it
              # exactly. A failed derivation fails this step.
              v3_name="$(python tools/provenance_attest_verify.py --repo "${GITHUB_WORKSPACE}" \
                --base "${BASE_SHA}" --candidate "${HEAD_SHA}" --policy-delta-key)"
              case "${v3_name}" in
                [0-9a-f]*) [ "${#v3_name}" -eq 64 ] || { echo "V3 policy delta name malformed" >&2; exit 1; } ;;
                *) echo "V3 policy delta name malformed" >&2; exit 1 ;;
              esac
              if gh api \
                -H "Accept: application/vnd.github.raw" \
                "repos/${TRUSTED_REPO}/contents/docs/provenance/policy-deltas-v3/${v3_name}.json?ref=${authority_sha}" \
                > "${RUNNER_TEMP}/trusted/policy-delta-authority.json" 2> "${RUNNER_TEMP}/trusted/v3-lookup.err"; then
                echo "V3 policy delta authority ${v3_name} materialized"
                echo "policy_delta_authority=${RUNNER_TEMP}/trusted/policy-delta-authority.json" >> "${GITHUB_OUTPUT}"
              else
                # Only a confirmed absence falls back; any other lookup error fails this step.
                if ! grep -q "HTTP 404" "${RUNNER_TEMP}/trusted/v3-lookup.err"; then
                  cat "${RUNNER_TEMP}/trusted/v3-lookup.err" >&2
                  echo "the V3 policy delta lookup failed for a reason other than its absence" >&2
                  exit 1
                fi
                # No V3 authority: an admission from before V3 deltas left a V1/V2 record keyed by
                # both profile digests (nested), or by the candidate digest alone (flat). The
                # verifier accepts such a record only for a change that adds no path.
                rm -f "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
                nested_policy_dir="docs/provenance/policy-deltas/${candidate_policy_sha}/${base_policy_sha}"
                flat_policy_dir="docs/provenance/policy-deltas/${candidate_policy_sha}"
                if gh api \
                  -H "Accept: application/vnd.github.raw" \
                  "repos/${TRUSTED_REPO}/contents/${nested_policy_dir}/candidate-policy.json?ref=${authority_sha}" \
                  > "${RUNNER_TEMP}/trusted/candidate-policy.json" && \
                  gh api \
                    -H "Accept: application/vnd.github.raw" \
                    "repos/${TRUSTED_REPO}/contents/${nested_policy_dir}/policy-delta-authority.json?ref=${authority_sha}" \
                    > "${RUNNER_TEMP}/trusted/policy-delta-authority.json" && \
                  test -s "${RUNNER_TEMP}/trusted/candidate-policy.json" && \
                  test -s "${RUNNER_TEMP}/trusted/policy-delta-authority.json"; then
                  policy_dir="${nested_policy_dir}"
                else
                  policy_dir="${flat_policy_dir}"
                  gh api \
                    -H "Accept: application/vnd.github.raw" \
                    "repos/${TRUSTED_REPO}/contents/${policy_dir}/candidate-policy.json?ref=${authority_sha}" \
                    > "${RUNNER_TEMP}/trusted/candidate-policy.json"
                  gh api \
                    -H "Accept: application/vnd.github.raw" \
                    "repos/${TRUSTED_REPO}/contents/${policy_dir}/policy-delta-authority.json?ref=${authority_sha}" \
                    > "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
                fi
                test -s "${RUNNER_TEMP}/trusted/candidate-policy.json"
                test -s "${RUNNER_TEMP}/trusted/policy-delta-authority.json"
                echo "policy delta authority materialized from ${policy_dir}"
                echo "trusted_candidate_policy=${RUNNER_TEMP}/trusted/candidate-policy.json" >> "${GITHUB_OUTPUT}"
                echo "policy_delta_authority=${RUNNER_TEMP}/trusted/policy-delta-authority.json" >> "${GITHUB_OUTPUT}"
              fi
              # v3-policy-delta-lookup:end
            fi
            # v4-policy-delta-lookup:end
          else
            echo "candidate policy equals trusted base policy; no policy delta authority required"
          fi

      # The public baseline is generated from the trusted authority for the
      # exact base commit, using the trusted checkout's verifier. The base
      # branch's committed ledger is not an input, so a stale or edited copy
      # on main cannot become the baseline. The envelope binds the base commit,
      # tree and policy, and the verify step checks that binding again.
      - name: Generate the trusted base public baseline from the authority
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted" "${RUNNER_TEMP}/baseline-scratch"
          baseline="${RUNNER_TEMP}/trusted/public-provenance-baseline.json"
          if ! python tools/provenance_attest_verify.py \
            --repo "${GITHUB_WORKSPACE}" \
            --base "${BASE_SHA}" \
            --trusted-ledger "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json" \
            --workdir "${RUNNER_TEMP}/baseline-scratch" \
            --emit-authority-baseline "${baseline}"; then
            echo "trusted base public provenance baseline could not be generated" >&2
            echo "the integration-time gate cannot verify this pull request; failing closed" >&2
            exit 1
          fi
          test -s "${baseline}"

      - name: Generate and verify ephemeral provenance controls
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
          TRUSTED_CANDIDATE_POLICY: ${{ steps.authority.outputs.trusted_candidate_policy }}
          POLICY_DELTA_AUTHORITY: ${{ steps.authority.outputs.policy_delta_authority }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/verify"
          # Existing exact path authority is sufficient for normal progress.
          # The legacy per-revision reviewed_blobs policy remains an explicit
          # opt-in via --require-reviewed-blobs for higher-assurance runs.
          # Exact immutable SHAs (the head and its merge base), never branch names: resolving
          # a branch twice can name two different trees.
          policy_args=()
          # A V3 authority comes alone; a V1/V2 authority with its blessed candidate policy. The
          # verifier refuses either the wrong way round.
          if [ -n "${POLICY_DELTA_AUTHORITY:-}" ]; then
            policy_args+=(--policy-delta-authority "${POLICY_DELTA_AUTHORITY}")
            if [ -n "${TRUSTED_CANDIDATE_POLICY:-}" ]; then
              policy_args+=(--trusted-candidate-policy "${TRUSTED_CANDIDATE_POLICY}")
            fi
          elif [ -n "${TRUSTED_CANDIDATE_POLICY:-}" ]; then
            echo "a blessed candidate policy needs its policy delta authority" >&2
            exit 1
          fi
          python tools/provenance_attest_verify.py \
            --repo "${GITHUB_WORKSPACE}" \
            --candidate "${HEAD_SHA}" \
            --base "${BASE_SHA}" \
            --require-immutable-revisions \
            --authority-revision "${AUTHORITY_SHA}" \
            --trusted-ledger "${RUNNER_TEMP}/trusted/IMPLEMENTATION_PROVENANCE.json" \
            --ephemeral \
            --trusted-baseline "${RUNNER_TEMP}/trusted/public-provenance-baseline.json" \
            --output-dir "${RUNNER_TEMP}/verify" \
            --json "${RUNNER_TEMP}/verify/verdict.json" \
            "${policy_args[@]}" \
            | tee "${RUNNER_TEMP}/verify/report.txt"

      # The publication audit of the candidate's whole tree, by the default
      # branch's own copy of the audit. The verifier above judges the paths the
      # profile publishes and new implementation paths; a file that is outside
      # the profile and is not implementation (game data, a key, a private path)
      # is not its subject. The pull request's own CI runs the audit too, but
      # from the pull request's checkout, where the pull request could have
      # changed the audit. Here it is the trusted copy, and it reads the
      # candidate's tree from its objects (git ls-tree, git cat-file): never a
      # checkout and never an archive, so no .gitattributes line of the
      # candidate can hide a file. The profile is the candidate's, which the
      # step above has just held to the trusted authority: a path it adds,
      # removes or excludes is one a maintainer admitted. The release manifest
      # is the candidate's too, and it waives binary findings for the files it
      # approves, so the audit is given the verdict base: a file the base
      # already carries keeps its waiver only for bytes the base vouches for
      # (the SHA-256 the base's own manifest pins, or the file the base
      # carries). The candidate cannot approve new bytes by changing a pin. No
      # secret is in this step's environment. A finding fails the job.
      - name: Audit the candidate tree with the trusted publication audit
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the candidate head is not a full commit SHA"
            exit 1
          fi
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the verdict base is not a full commit SHA"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/tree-audit"
          git cat-file blob "${HEAD_SHA}:assets/public_source_profile.json" \
            > "${RUNNER_TEMP}/tree-audit/public_source_profile.json"
          python tools/publish_audit.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --committed-tree "${HEAD_SHA}" \
            --trusted-base "${BASE_SHA}" \
            --policy "${RUNNER_TEMP}/tree-audit/public_source_profile.json" \
            --public-scope --provenance-self-consistency
          touch "${RUNNER_TEMP}/tree-audit/passed"

      # The first thing the pull-request author reads. The verdict itself is
      # unchanged -- this job still fails closed -- but a failure that only
      # means "a maintainer must admit this path" is now said in one sentence
      # instead of a bare FAIL. The explanation is produced by the verifier that
      # produced the verdict, from the same file, so the two cannot disagree.
      - name: Explain the verdict in plain words
        if: always()
        run: |
          set -euo pipefail
          if [ -s "${RUNNER_TEMP}/verify/verdict.json" ]; then
            python tools/provenance_attest_verify.py \
              --explain-verdict "${RUNNER_TEMP}/verify/verdict.json" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '### Provenance: no verdict was produced' >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
            echo 'The attestation did not run to completion. That is a gate failure, not a pass.' \
              >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
          fi
          # The trusted tree audit fails the job on its own; say so here too, without copying its
          # findings (the candidate's own paths) into the summary. They are in that step's log.
          if [ -e "${RUNNER_TEMP}/tree-audit/public_source_profile.json" ] \
            && [ ! -e "${RUNNER_TEMP}/tree-audit/passed" ]; then
            echo '### Trusted publication audit: FAIL' >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
            echo 'The default branch publication audit refused the candidate tree. Its findings are in the log' \
              'of the step "Audit the candidate tree with the trusted publication audit".' \
              >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Runs on failure too, so a maintainer reads the finding codes in the pull
      # request rather than opening the log. Only the public report is copied,
      # and it is copied as a file rather than interpolated into the script.
      - name: Publish the public report
        if: always()
        env:
          AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
        run: |
          set -euo pipefail
          {
            echo '### Trusted provenance attestation'
            echo
            echo '> **OBSERVATION MODE — this is not enforcement.** This check is'
            echo '> deliberately NOT a required status check until its producer'
            echo '> identity is protected. The verifier generated the ledger/export'
            echo '> outside the candidate checkout; any legacy copies were untrusted'
            echo '> compatibility data. See docs/PROVENANCE_MERGE_GATE.md.'
            echo
            echo "Trusted authority: ${AUTHORITY_SHA:-unavailable}"
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/verify/report.txt" 2>/dev/null || echo 'the verifier did not produce a report'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  showcase_prx:
    name: Showcase demo PRXs (PSPDEV)
    # The showcase demos ship in the candidate bundle under bin/demos, where the
    # player finds them. Their PSP programs need PSPDEV, a POSIX toolchain, so this
    # job builds the PRXs on Linux with the distribution pinned by
    # assets/upstream/pspdev.lock.json, installed as ci.yml's public_export
    # job installs it for the profile-zero fixture. The candidate job builds the packages from them and attests
    # them with the rest of the bundle. Dispatch only from main, for the candidate: a dispatch
    # that attests a pull request leaves candidate_sha empty and runs neither candidate job.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_sha != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate the frozen candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Showcase PRXs for a candidate must build from main; got $GITHUB_REF" >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'candidate_sha must be a full lowercase 40-character commit SHA.' >&2
            exit 1
          fi
          if [ "$CANDIDATE_SHA" != "$GITHUB_SHA" ]; then
            echo "candidate_sha does not match this workflow's checked out commit ($GITHUB_SHA)." >&2
            exit 1
          fi

      - name: Check out the dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm checkout matches the frozen candidate
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "Checked-out commit $checked_out does not match the dispatched commit $GITHUB_SHA." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install PSPDEV from the checked-in lock
        run: |
          read -r PSPDEV_URL PSPDEV_SHA256 < <(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("assets/upstream/pspdev.lock.json").read_text())
          evidence = json.loads(Path("assets/upstream/pspdev.evidence.json").read_text())
          distribution = lock["distribution"]
          archive = evidence["archive"]
          if distribution["release"] != evidence["release"]:
              raise SystemExit("PSPDEV release disagrees with its evidence")
          expected = distribution["archive_sha256"]
          if archive["local_sha256"] != expected or archive["github_asset_digest"] != "sha256:" + expected:
              raise SystemExit("PSPDEV archive digest disagrees with the checked-in lock")
          print(archive["download_url"], expected)
          PY
          )
          echo "PSPDEV_URL=$PSPDEV_URL" >> "$GITHUB_ENV"
          echo "PSPDEV_SHA256=$PSPDEV_SHA256" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/pspdev.tar.gz"
          curl --fail --location --retry 3 "$PSPDEV_URL" --output "$archive"
          printf '%s  %s\n' "$PSPDEV_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/pspdev-unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pspdev-unpacked"
          psp_gcc=$(find "$RUNNER_TEMP/pspdev-unpacked" -path '*/bin/psp-gcc' -print -quit)
          if [[ -z "$psp_gcc" ]]; then
            echo "locked PSPDEV archive did not contain bin/psp-gcc" >&2
            exit 1
          fi
          psp_root=${psp_gcc%/bin/psp-gcc}
          test -x "$psp_root/bin/psp-prxgen"
          sudo mkdir -p /usr/local/pspdev
          sudo cp -a "$psp_root"/. /usr/local/pspdev/
          test -x /usr/local/pspdev/bin/psp-gcc
          test -x /usr/local/pspdev/bin/psp-prxgen
          echo "/usr/local/pspdev/bin" >> "$GITHUB_PATH"
          echo "PSPDEV=/usr/local/pspdev" >> "$GITHUB_ENV"

      - name: Build the showcase demo PRXs
        run: |
          set -euo pipefail
          NK_SHOWCASE_BUILD_ROOT="$RUNNER_TEMP/showcase" \
            python fixtures/showcase/showcase.py build-prx --out-dir "$RUNNER_TEMP/showcase-prx"
          test -s "$RUNNER_TEMP/showcase-prx/showcase_scene_app.prx"
          test -s "$RUNNER_TEMP/showcase-prx/showcase_breakout_app.prx"
          test -s "$RUNNER_TEMP/showcase-prx/PSPSDK-LICENSE.txt"

      - name: Upload the showcase demo PRXs (workflow artifact only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-prx-${{ github.sha }}
          path: ${{ runner.temp }}/showcase-prx/
          if-no-files-found: error
          retention-days: 7

  candidate_binary_l2:
    name: Candidate binary build and SLSA Build L2
    # Dispatch only from main. The source digest is checked against the
    # required candidate input before any build or OIDC permission is used.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_sha != '' }}
    needs: [showcase_prx]
    runs-on: windows-2025
    # The player, the synthetic smoke and the two showcase demo packages compile
    # on the runner's 2 vCPUs.
    timeout-minutes: 75
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      SR_SOURCE_COMMIT: ${{ github.sha }}
      VULKAN_SDK: /ucrt64
    steps:
      - name: Validate the frozen candidate identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Candidate binary attestation must run from main; got $env:GITHUB_REF"
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
              throw 'candidate_sha must be a full lowercase 40-character commit SHA.'
          }
          if ($env:CANDIDATE_SHA -ne $env:GITHUB_SHA) {
              throw "candidate_sha does not match this workflow's checked out commit ($env:GITHUB_SHA)."
          }

      # workflow_dispatch is main-only and its immutable event SHA is checked
      # against candidate_sha above and after checkout. Leave ref unset here:
      # the trusted PR job above is the workflow's sole explicit checkout ref.
      - name: Check out the dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm checkout matches the frozen candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($checkedOutSha -ne $env:GITHUB_SHA) {
              throw "Checked-out commit $checkedOutSha does not match the dispatched commit $env:GITHUB_SHA."
          }

      - name: Set up Windows CPython 3.15.2
        id: windows-cpython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
          architecture: x64

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      # MSYS2 still ships Python 3.14.8; the release manifest's toolchain policy
      # is Python 3.15. As in the CI Windows job, repository tools and Make recipes
      # use the separately installed Windows CPython 3.15.2 through PYTHON, and the
      # toolchain record names that interpreter.
      - name: Pin the Windows Python toolchain (CPython 3.15.2)
        shell: pwsh
        env:
          PYTHON_EXE: ${{ steps.windows-cpython.outputs.python-path }}
        run: |
          $version = & $env:PYTHON_EXE -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          if ($LASTEXITCODE -ne 0 -or $version -ne "3.15.2") {
            throw "Expected Windows CPython 3.15.2, got '$version'"
          }
          $pythonPath = $env:PYTHON_EXE.Replace('\', '/')
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PYTHON=$pythonPath`n", $utf8NoBom)

      # The runner image puts other MinGW toolchains on PATH (its mingw64\bin,
      # Strawberry Perl's c\bin). tools/record_toolchain.py refuses a compiler or
      # Make that also resolves outside UCRT64, and the build and the runtime-DLL
      # staging must not reach one either. Keep every MSYS2 entry and drop each
      # other PATH entry that provides gcc, g++ or a Make; the steps below run
      # with exactly this PATH, so the record describes the tools they use.
      - name: Keep only the UCRT64 toolchain on PATH
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          IFS=';' read -r -a exts <<< "${PATHEXT:-.COM;.EXE;.BAT;.CMD}"
          exts=('' "${exts[@]}")
          kept=()
          IFS=: read -r -a entries <<< "$PATH"
          for dir in "${entries[@]}"; do
            case "$dir" in
              '') continue ;;
              "$MINGW_PREFIX"/*|/usr/*|/bin) kept+=("$dir"); continue ;;
            esac
            for tool in gcc g++ make mingw32-make; do
              for ext in "${exts[@]}"; do
                if [ -e "$dir/$tool$ext" ]; then
                  echo "dropped from PATH: $dir ($tool$ext)"
                  continue 3
                fi
              done
            done
            kept+=("$dir")
          done
          (IFS=:; printf '%s' "${kept[*]}") > "$(cygpath -u "$RUNNER_TEMP")/nk-toolchain-path"

      - name: Record the toolchain used for these binaries
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          PATH="$(cat "$(cygpath -u "$RUNNER_TEMP")/nk-toolchain-path")"
          export PATH
          command -v git
          command -v gcc mingw32-make
          "$PYTHON" --version
          toolchain_json="$(cygpath -u "$RUNNER_TEMP")/nakagawa-toolchain.json"
          "$PYTHON" tools/record_toolchain.py \
            --require-clean-tree \
            --output "$toolchain_json" \
            --msys-path "$(cygpath -m "$MINGW_PREFIX/bin")" \
            --vulkan-sdk "$(cygpath -m "$VULKAN_SDK")"
          test -s "$toolchain_json"
          echo "NAKAGAWA_TOOLCHAIN_JSON=$toolchain_json" >> "$GITHUB_ENV"

      - name: Build the candidate player and synthetic smoke binaries
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          PATH="$(cat "$(cygpath -u "$RUNNER_TEMP")/nk-toolchain-path")"
          export PATH
          command -v pwsh
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 player
          mingw32-make --no-print-directory CC=gcc VULKAN_SDK=/ucrt64 production-smoke

      - name: Stage the binary and runtime closure
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          PATH="$(cat "$(cygpath -u "$RUNNER_TEMP")/nk-toolchain-path")"
          export PATH
          mkdir -p dist/bin
          cp build/nakagawa_player.exe build/production-smoke/production_smoke.exe dist/bin/
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/copy_build_assets.ps1 \
            -BuildDir "$(cygpath -m "$PWD/dist/bin")" \
            -ProjectFontDir "$(cygpath -m "$PWD/build/project-font")" \
            -Sdl3DllPath "$(cygpath -m "$MINGW_PREFIX/bin/SDL3.dll")" \
            -ExcludeOptionalFonts
          # --include-ui-fonts: the player starts its launcher UI only when assets/fonts/ui is
          # beside it, and otherwise exits with code 4 (the Makefile's player
          # target stages the same set). --runtime-manifest records the size, SHA-256 and imports
          # of every .exe and .dll in dist/bin and fails when an import is not beside them (#324).
          "$PYTHON" tools/stage_runtime_dlls.py --target dist/bin --include-ui-fonts --runtime-manifest
          "$PYTHON" tools/stage_runtime_dlls.py --target dist/bin --verify-runtime-manifest
          test -s dist/bin/assets/fonts/ui/manifest.json
          cp "$NAKAGAWA_TOOLCHAIN_JSON" dist/toolchain.json
          test -s dist/bin/nakagawa_player.exe
          test -s dist/bin/production_smoke.exe
          test -s dist/toolchain.json

      - name: Download the showcase demo PRXs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-prx-${{ github.sha }}
          path: ${{ runner.temp }}/showcase-prx

      # The player looks for the showcase demos in demos/ beside its executable
      # (player_app_discover_showcase). Their packages are built here, with this
      # job's toolchain and PATH, from the PRXs the showcase_prx job built, so the
      # attestation below covers them with the rest of the bundle.
      - name: Build the showcase demo packages into the bundle
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          set -euo pipefail
          PATH="$(cat "$(cygpath -u "$RUNNER_TEMP")/nk-toolchain-path")"
          export PATH
          NK_SHOWCASE_DEMO_ROOT=dist/bin/demos \
          NK_SHOWCASE_BUILD_ROOT="$(cygpath -m "$RUNNER_TEMP/showcase")" \
            "$PYTHON" fixtures/showcase/showcase.py build \
            --prebuilt-prx-dir "$(cygpath -m "$RUNNER_TEMP/showcase-prx")"
          for disc in TEST00007 TEST00008; do
            test -s "dist/bin/demos/images/$disc.iso"
            test -s "dist/bin/demos/packages/$disc/package.json"
          done
          test -s dist/bin/demos/THIRD_PARTY_NOTICES/PSPSDK-LICENSE.txt

      - name: Attest the complete staged binary bundle (SLSA Build L2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**/*
          push-to-registry: false
          create-storage-record: false

      # The showcase packages keep their build stamps (.codegen-profile-*,
      # .runtime-profile-*, .recomp-profile-*) as dot-files, and their
      # completion manifests list them. upload-artifact leaves dot-files out
      # unless told otherwise, and the player then hides both demos as stale.
      - name: Upload the attested candidate bundle (workflow artifact only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nakagawa-windows-x64-binaries-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
